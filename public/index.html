<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#00432F" media="(prefers-color-scheme: dark)">
  <!-- Settings → Appearance, applied before the first paint so the screen never flashes. Same logic: js/theme.js -->
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='dark'?'#00432F':'#FFFFFF'})}}catch(e){}</script>
  <title>CoachIt — Coaching pilot</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot"><div class="spinner" aria-hidden="true"></div><p>Loading…</p></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Please enable JavaScript to use this site.</noscript>
</body>
</html>
