<!-- Supabase → Authentication → Emails → Templates → "Reset password".
     Subject: Reset your CoachIt password
     Paste everything below this comment into the message body. {{ .ConfirmationURL }} is filled in by Supabase.
     Email apps ignore most CSS, so this uses tables and inline styles, brand colours only, and system fonts. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFFFFF;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;font-family:Arial,Helvetica,sans-serif;color:#00432F;">
        <tr>
          <td style="font-size:22px;font-weight:800;padding-bottom:24px;">CoachIt.</td>
        </tr>
        <tr>
          <td style="background:#E3EFEA;border-radius:16px;padding:24px;">
            <p style="margin:0 0 12px;font-size:20px;font-weight:700;">Reset your password</p>
            <p style="margin:0 0 24px;font-size:16px;line-height:26px;">
              We got a request to reset the password for your CoachIt account. Tap the button to choose a new one.
              The link works for 1 hour.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background:#00432F;border-radius:999px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;">Choose a new password</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding-top:24px;font-size:14px;line-height:22px;color:#006A4E;">
            If you didn't ask for this, you can ignore this email. Your password stays the same.<br>
            Questions? <a href="mailto:coachitapp@gmail.com" style="color:#00432F;">coachitapp@gmail.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
